<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Emotion AI - 1Week</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 { margin-bottom: 1.5rem; font-size: 1.5rem; color: #2c3e50; }

        .upload-area {
            border: 2px dashed #cbd5e0;
            padding: 2rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 1rem;
        }

        .upload-area:hover { border-color: var(--primary-color); background: #f0f7ff; }

        #audioFile { display: none; }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        .btn:disabled { background-color: #a0aec0; cursor: not-allowed; }

        #fileNameDisplay { margin-top: 0.5rem; font-size: 0.9rem; color: #718096; }

        #loading { margin-top: 1rem; display: none; }
        .spinner {
            border: 4px solid rgba(0,0,0,0.1);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border-left-color: var(--primary-color);
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #result { margin-top: 2rem; display: none; text-align: left; border-top: 1px solid #edf2f7; padding-top: 1.5rem; }
        .top-emotion-box {
            background: #eef2ff;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .top-emotion-label { font-size: 0.9rem; color: #6366f1; font-weight: bold; margin-bottom: 0.3rem; }
        .top-emotion-value { font-size: 1.8rem; font-weight: 800; color: #3730a3; text-transform: uppercase; }

        .emotion-bar-container { margin-bottom: 0.8rem; }
        .emotion-info { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.3rem; }
        .bar-bg { background: #edf2f7; height: 8px; border-radius: 4px; overflow: hidden; }
        .bar-fill { background: var(--primary-color); height: 100%; border-radius: 4px; transition: width 0.5s ease-out; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ Voice Emotion AI</h1>
        <p style="color: #718096; font-size: 0.9rem; margin-bottom: 2rem;">음성 파일을 업로드하여 감정을 분석하세요 (1주차)</p>
        
        <div class="upload-area" onclick="document.getElementById('audioFile').click()">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#a0aec0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            <p>파일을 선택하거나 드래그하세요</p>
            <div id="fileNameDisplay">선택된 파일 없음</div>
        </div>
        
        <input type="file" id="audioFile" accept="audio/*" onchange="handleFileSelect(event)">
        <button onclick="uploadAudio()" id="uploadBtn" class="btn">분석 시작하기</button>
        
        <div id="loading">
            <div class="spinner"></div>
            <span>AI 분석 중...</span>
        </div>

        <div id="result">
            <div class="top-emotion-box">
                <div class="top-emotion-label">가장 강한 감정</div>
                <div id="resTopEmotion" class="top-emotion-value">-</div>
            </div>
            
            <div id="emotionBars"></div>
            <p style="font-size: 0.8rem; color: #a0aec0; margin-top: 1rem;">파일명: <span id="resFilename"></span></p>
        </div>
    </div>

    <script>
        function handleFileSelect(event) {
            const fileName = event.target.files[0]?.name || '선택된 파일 없음';
            document.getElementById('fileNameDisplay').innerText = fileName;
        }

        async function uploadAudio() {
            const fileInput = document.getElementById('audioFile');
            const resultDiv = document.getElementById('result');
            const loadingDiv = document.getElementById('loading');
            const uploadBtn = document.getElementById('uploadBtn');

            if (!fileInput.files.length) {
                alert('파일을 선택해주세요!');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            // UI 상태 초기화
            loadingDiv.style.display = 'block';
            resultDiv.style.display = 'none';
            uploadBtn.disabled = true;

            try {
                // 백엔드 URL (B역할의 FastAPI 서버 주소)
                const response = await fetch('http://localhost:8000/analyze-audio', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('서버와 통신할 수 없습니다.');

                const data = await response.json();
                displayResult(data);
            } catch (error) {
                console.error(error);
                alert('오류 발생: ' + error.message + '\n백엔드 서버가 실행 중인지 확인하세요.');
            } finally {
                loadingDiv.style.display = 'none';
                uploadBtn.disabled = false;
            }
        }

        function displayResult(data) {
            const resultDiv = document.getElementById('result');
            document.getElementById('resFilename').innerText = data.filename;
            document.getElementById('resTopEmotion').innerText = data.topEmotion;

            const barsContainer = document.getElementById('emotionBars');
            barsContainer.innerHTML = '';
            
            // 점수순 정렬
            const sortedResults = [...data.result].sort((a, b) => b.score - a.score);

            sortedResults.forEach(item => {
                const percent = (item.score * 100).toFixed(1);
                const barHtml = `
                    <div class="emotion-bar-container">
                        <div class="emotion-info">
                            <span>${item.label}</span>
                            <span>${percent}%</span>
                        </div>
                        <div class="bar-bg">
                            <div class="bar-fill" style="width: 0%"></div>
                        </div>
                    </div>
                `;
                barsContainer.insertAdjacentHTML('beforeend', barHtml);
                
                // 애니메이션 효과를 위해 시간차를 두고 너비 설정
                setTimeout(() => {
                    const lastBar = barsContainer.lastElementChild.querySelector('.bar-fill');
                    lastBar.style.width = percent + '%';
                }, 50);
            });

            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
